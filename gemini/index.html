<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SlideCraft 簡報排版設計實驗室 — Studio Pro v3.0</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Noto Sans TC (黑體), Noto Serif TC (明體對比示範), JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@400;700&display=swap" rel="stylesheet">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans TC"', 'sans-serif'],
                        serif: ['"Noto Serif TC"', 'PMingLiU', 'serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    },
                    colors: {
                        studio: {
                            bg: '#090d16',
                            panel: '#111827',
                            surface: '#1e293b',
                            border: '#334155',
                            accent: '#6366f1',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Figma / Canva Dark Workspace Dot Grid */
        .bg-dot-grid {
            background-color: #090d16;
            background-image: radial-gradient(#1e293b 1.5px, transparent 1.5px);
            background-size: 24px 24px;
        }

        /* Checkerboard pattern for fake transparency NG demo */
        .bg-checkerboard {
            background-color: #ffffff;
            background-image: 
                linear-gradient(45deg, #cbd5e1 25%, transparent 25%), 
                linear-gradient(-45deg, #cbd5e1 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #cbd5e1 75%), 
                linear-gradient(-45deg, transparent 75%, #cbd5e1 75%);
            background-size: 16px 16px;
            background-position: 0 0, 0 8px, 8px -8px, -8px 0;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }

        /* Smooth Transitions on Slide Canvas */
        .slide-canvas, .slide-element {
            transition: all 0.32s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Simulated Low-Res Blur for NG Image Demo */
        .pixelated-ng {
            filter: contrast(1.15) brightness(0.95) blur(0.6px);
        }

        /* Tabular numbers for tables */
        .tabular-nums {
            font-variant-numeric: tabular-nums;
        }
    </style>
</head>
<body class="bg-studio-bg text-slate-100 font-sans h-screen flex flex-col overflow-hidden select-none">

    <!-- ==================== TOP STUDIO HEADER BAR ==================== -->

        <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 flex items-center justify-center shadow-lg shadow-indigo-500/20">
                <i class="ph-bold ph-presentation-chart text-white text-xl"></i>
            </div>
            <div>
                <div class="flex items-center gap-2">
                    <span class="font-bold text-base tracking-tight text-white">SlideCraft</span>
                    <span class="text-[11px] font-mono uppercase px-2 py-0.5 bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 rounded-full">Studio Pro v3.0</span>
                </div>
                <p class="text-xs text-slate-400">簡報排版設計互動實驗室 • 12 大實戰改造案例</p>
            </div>
        </div>

        <!-- 5 Module Navigation Tabs -->
        <nav class="flex items-center bg-slate-900/90 p-1 rounded-xl border border-slate-800" id="module-tabs">
            <button onclick="switchModule('color')" id="tab-color" class="module-tab flex items-center gap-2 px-3.5 py-2 rounded-lg text-sm font-medium transition-all">

                <span>1. 色彩配置</span>

            <button onclick="switchModule('typo')" id="tab-typo" class="module-tab flex items-center gap-2 px-3.5 py-2 rounded-lg text-sm font-medium transition-all">

                <span>2. 文字排版</span>
                <span id="badge-typo" class="text-[10px] font-mono px-1.5 py-0.2 rounded-full bg-rose-500/20 text-rose-300 border border-rose-500/30">0/9</span>
            </button>
            <button onclick="switchModule('image')" id="tab-image" class="module-tab flex items-center gap-2 px-3.5 py-2 rounded-lg text-sm font-medium transition-all">
                <i class="ph-fill ph-image text-lg"></i>
                <span>3. 圖片視覺</span>
                <span id="badge-image" class="text-[10px] font-mono px-1.5 py-0.2 rounded-full bg-rose-500/20 text-rose-300 border border-rose-500/30">0/9</span>
            </button>
            <button onclick="switchModule('layout')" id="tab-layout" class="module-tab flex items-center gap-2 px-3.5 py-2 rounded-lg text-sm font-medium transition-all">
                <i class="ph-fill ph-layout text-lg"></i>
                <span>4. 版面留白</span>
                <span id="badge-layout" class="text-[10px] font-mono px-1.5 py-0.2 rounded-full bg-rose-500/20 text-rose-300 border border-rose-500/30">0/9</span>
            </button>
            <div class="w-px h-5 bg-slate-700 mx-1"></div>
            <button onclick="switchModule('quiz')" id="tab-quiz" class="module-tab flex items-center gap-2 px-3.5 py-2 rounded-lg text-sm font-medium transition-all">
                <i class="ph-fill ph-trophy text-lg text-amber-400"></i>
                <span>5. 終極實戰挑戰 (8題)</span>
            </button>
        </nav>

        <!-- Right Progress & Quick Actions -->
        <div class="flex items-center gap-3">
            <div class="flex items-center gap-2.5 bg-slate-900 px-3 py-1.5 rounded-lg border border-slate-800">
                <div class="text-xs text-slate-400">全站修復進度</div>
                <div class="w-20 h-2 bg-slate-800 rounded-full overflow-hidden">
                    <div id="global-progress-bar" class="h-full bg-gradient-to-r from-indigo-500 to-emerald-400 transition-all duration-300" style="width: 0%"></div>
                </div>
                <span id="global-progress-text" class="text-xs font-mono font-bold text-emerald-400">0/36</span>
            </div>

            <div id="quick-action-group" class="flex items-center gap-1.5">
                <button onclick="setAllCurrentCase(false)" class="px-2.5 py-1.5 rounded-lg text-xs font-medium bg-rose-500/10 hover:bg-rose-500/20 text-rose-300 border border-rose-500/30 transition flex items-center gap-1" title="將本案例還原為常見學生錯誤排版">

                <button onclick="setAllCurrentCase(true)" class="px-2.5 py-1.5 rounded-lg text-xs font-medium bg-emerald-500/15 hover:bg-emerald-500/25 text-emerald-300 border border-emerald-500/30 transition flex items-center gap-1" title="一鍵套用本案例專業設計師排版">

            </div>
        </div>
    </header>

    <!-- ==================== MAIN WORKSPACE AREA ==================== -->
    <main class="flex-1 flex overflow-hidden">

        <!-- LEFT INSPECTOR SIDEBAR (Hidden in Quiz Mode) -->
        <aside id="left-inspector" class="w-[410px] bg-studio-panel border-r border-studio-border flex flex-col shrink-0 z-20">
            <!-- Module Header & Case Switcher -->
            <div class="p-4 border-b border-studio-border bg-slate-900/50 space-y-3">
                <div class="flex items-center justify-between">
                    <span id="inspector-tag" class="text-[11px] font-mono uppercase tracking-wider text-indigo-400 font-semibold">MODULE 01 • COLOR HARMONY</span>
                    <span id="inspector-status-pill" class="text-xs px-2.5 py-0.5 rounded-full font-medium bg-rose-500/20 text-rose-300 border border-rose-500/30">尚有 3 個排版地雷</span>
                </div>

                <!-- 3-Case Selector Pill Bar -->
                <div class="grid grid-cols-3 gap-1.5 bg-slate-950 p-1 rounded-xl border border-slate-800" id="case-selector-bar">
                    <!-- Populated via JS -->
                </div>

                <div>
                    <h2 id="inspector-title" class="text-base font-bold text-white">色彩配置與視覺層次</h2>
                    <p id="inspector-desc" class="text-xs text-slate-400 mt-1 leading-relaxed">
                        請點擊下方控制開關（或按數字鍵 1 / 2 / 3），逐步修正投影片中的設計地雷。

                </div>
            </div>

            <!-- Interactive Toggles List -->

            </div>

            <!-- Dynamic Live Meter / Rule Box in Left Sidebar Bottom -->
            <div id="inspector-meter" class="p-3.5 border-t border-studio-border bg-slate-900/80">
                <!-- Populated by JS -->
            </div>
        </aside>

        <!-- CENTER INTERACTIVE CANVAS WORKSPACE -->

            <div id="canvas-toolbar" class="h-12 px-6 flex items-center justify-between border-b border-slate-800/80 bg-slate-950/60 backdrop-blur-sm z-10">

                    <!-- Safe Margin & Alignment Grid Toggle -->
                    <button onclick="toggleGridOverlay()" id="btn-grid-overlay" class="px-3 py-1 rounded-md text-xs font-medium bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 transition flex items-center gap-1.5">
                        <i class="ph ph-grid-four"></i>
                        <span>顯示安全邊距與格線 (G)</span>
                    </button>

                    <!-- Hold to Compare NG vs Current/OK -->
                    <button onmousedown="startCompareHold()" onmouseup="endCompareHold()" onmouseleave="endCompareHold()" class="px-3 py-1 rounded-md text-xs font-medium bg-indigo-500/20 hover:bg-indigo-500/30 text-indigo-300 border border-indigo-500/40 transition flex items-center gap-1.5 active:scale-95">
                        <i class="ph-bold ph-eye"></i>
                        <span>按住對比原始災難版 (Space)</span>
                    </button>
                </div>
            </div>

            <!-- 16:9 Slide Container Wrapper -->
            <div id="slide-stage-wrapper" class="flex-1 flex items-center justify-center p-6 lg:p-10 overflow-hidden">

                    <!-- Simulated Slide Content Rendered Here -->
                    <div id="slide-viewport" class="w-full h-full relative overflow-hidden slide-canvas select-text">
                        <!-- Dynamically rendered per module -->
                    </div>

                    <!-- Designer Grid & Safe Margin Overlay -->
                    <div id="grid-overlay" class="inset-0 pointer-events-none hidden z-30">
                        <div class="absolute inset-[7%] border-2 border-dashed border-cyan-400/80 bg-cyan-500/5 flex flex-col justify-between p-2">
                            <div class="flex justify-between items-start">
                                <span class="bg-cyan-500 text-slate-950 font-mono text-[10px] font-bold px-1.5 py-0.5 rounded">SAFE MARGIN 8% 安全留白邊界</span>
                                <span class="bg-cyan-500 text-slate-950 font-mono text-[10px] font-bold px-1.5 py-0.5 rounded">視覺對齊基準線</span>
                            </div>

                                <div class="border-x border-cyan-400/30 bg-cyan-400/5"></div>
                                <div class="border-x border-cyan-400/30 bg-cyan-400/5"></div>
                            </div>
                            <div class="text-right">
                                <span class="bg-cyan-500/90 text-slate-950 font-mono text-[10px] font-bold px-1.5 py-0.5 rounded">避免將文字貼齊投影片最外框</span>

                </div>
            </div>

            <footer id="bottom-takeaway" class="bg-studio-panel border-t border-studio-border px-6 py-3.5 z-10">

            </div>
        </section>

    </main>

                    { text: '將第 1 階段放右下角、第 5 階段放左上角，倒著排列考驗評審眼力', correct: false, feedback: '違背自然閱讀動線（由左至右）會讓觀眾在理解時間順序時感到混亂。' }
                ]
            }
        ];

        // =========================================================================
        // 3. UI RENDERING & KEYBOARD SHORTCUT HANDLERS
        // =========================================================================
        function initApp() {
            renderTopTabs();
            renderInspector();
            renderSlideViewport();
            renderBottomTakeaways();
            updateGlobalProgress();

            // Keyboard Shortcuts
            window.addEventListener('keydown', (e) => {
                if (state.currentModule === 'quiz') return;
                if (e.code === 'Space' && !state.isComparingNG && document.activeElement.tagName !== 'BUTTON') {
                    e.preventDefault();
                    startCompareHold();
                } else if (e.key === '1') {
                    toggleControl(state.currentModule, 'c1');
                } else if (e.key === '2') {
                    toggleControl(state.currentModule, 'c2');
                } else if (e.key === '3') {
                    toggleControl(state.currentModule, 'c3');
                } else if (e.key.toLowerCase() === 'g') {
                    toggleGridOverlay();
                }
            });

            window.addEventListener('keyup', (e) => {
                if (e.code === 'Space' && state.isComparingNG) {
                    endCompareHold();
                }
            });
        }

        function switchModule(moduleName) {
            state.currentModule = moduleName;
            const leftInspector = document.getElementById('left-inspector');
            const canvasWorkspace = document.getElementById('canvas-workspace');
            const quizWorkspace = document.getElementById('quiz-workspace');
            const quickActionGroup = document.getElementById('quick-action-group');

            renderTopTabs();

            if (moduleName === 'quiz') {
                leftInspector.classList.add('hidden');
                canvasWorkspace.classList.add('hidden');
                quizWorkspace.classList.remove('hidden');
                quickActionGroup.classList.add('opacity-0', 'pointer-events-none');
                renderQuiz();
            } else {
                leftInspector.classList.remove('hidden');
                canvasWorkspace.classList.remove('hidden');
                quizWorkspace.classList.add('hidden');
                quickActionGroup.classList.remove('opacity-0', 'pointer-events-none');
                renderInspector();
                renderSlideViewport();
                renderBottomTakeaways();
            }
        }

        function switchCase(caseIdx) {
            if (state.currentModule === 'quiz') return;
            state.currentCaseIndex[state.currentModule] = caseIdx;
            renderInspector();
            renderSlideViewport();
            renderBottomTakeaways();
        }

        function getCurrentCaseSpec() {
            const mod = state.currentModule;
            if (mod === 'quiz') return null;
            const idx = state.currentCaseIndex[mod];
            return moduleSpecs[mod].cases[idx];
        }

        function renderTopTabs() {
            const modules = ['color', 'typo', 'image', 'layout', 'quiz'];
            modules.forEach(m => {
                const btn = document.getElementById(`tab-${m}`);
                if (!btn) return;
                if (state.currentModule === m) {
                    btn.className = 'module-tab flex items-center gap-2 px-3.5 py-2 rounded-lg text-sm font-bold bg-indigo-600 text-white shadow-md shadow-indigo-600/30 transition-all';
                } else {
                    btn.className = 'module-tab flex items-center gap-2 px-3.5 py-2 rounded-lg text-sm font-medium text-slate-400 hover:text-slate-200 hover:bg-slate-800/60 transition-all';
                }

                if (m !== 'quiz') {
                    const badge = document.getElementById(`badge-${m}`);
                    let fixedCount = 0;
                    state.toggles[m].forEach(caseObj => {
                        fixedCount += Object.values(caseObj).filter(Boolean).length;
                    });
                    badge.textContent = `${fixedCount}/9`;
                    if (fixedCount === 9) {
                        badge.className = 'text-[10px] font-mono font-bold px-1.5 py-0.2 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/40';
                    } else if (fixedCount > 0) {
                        badge.className = 'text-[10px] font-mono font-bold px-1.5 py-0.2 rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/40';
                    } else {
                        badge.className = 'text-[10px] font-mono px-1.5 py-0.2 rounded-full bg-rose-500/20 text-rose-300 border border-rose-500/30';
                    }
                }
            });
        }

        function updateGlobalProgress() {
            let totalFixed = 0;
            ['color', 'typo', 'image', 'layout'].forEach(m => {
                state.toggles[m].forEach(caseObj => {
                    totalFixed += Object.values(caseObj).filter(Boolean).length;
                });
            });
            const pct = Math.round((totalFixed / 36) * 100);
            document.getElementById('global-progress-bar').style.width = `${pct}%`;
            document.getElementById('global-progress-text').textContent = `${totalFixed}/36`;
            renderTopTabs();
        }

        function toggleControl(moduleName, key) {
            const idx = state.currentCaseIndex[moduleName];
            state.toggles[moduleName][idx][key] = !state.toggles[moduleName][idx][key];
            renderInspector();
            renderSlideViewport();
            updateGlobalProgress();
        }

        function setAllCurrentCase(val) {
            if (state.currentModule === 'quiz') return;
            const mod = state.currentModule;
            const idx = state.currentCaseIndex[mod];
            Object.keys(state.toggles[mod][idx]).forEach(k => {
                state.toggles[mod][idx][k] = val;
            });
            renderInspector();
            renderSlideViewport();
            updateGlobalProgress();
        }

        function toggleGridOverlay() {
            state.showGrid = !state.showGrid;
            const grid = document.getElementById('grid-overlay');
            const btn = document.getElementById('btn-grid-overlay');
            if (state.showGrid) {
                grid.classList.remove('hidden');
                grid.classList.add('absolute');
                btn.className = 'px-3 py-1 rounded-md text-xs font-semibold bg-cyan-500/20 text-cyan-300 border border-cyan-400/50 transition flex items-center gap-1.5';
            } else {
                grid.classList.add('hidden');
                grid.classList.remove('absolute');
                btn.className = 'px-3 py-1 rounded-md text-xs font-medium bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 transition flex items-center gap-1.5';
            }
        }

        function startCompareHold() {
            state.isComparingNG = true;
            document.getElementById('compare-badge').classList.remove('hidden');
            renderSlideViewport();
        }

        function endCompareHold() {
            if (!state.isComparingNG) return;
            state.isComparingNG = false;
            document.getElementById('compare-badge').classList.add('hidden');
            renderSlideViewport();
        }

        // =========================================================================
        // 4. LEFT INSPECTOR PANEL RENDERER
        // =========================================================================
        function renderInspector() {
            const mod = state.currentModule;
            if (mod === 'quiz') return;

            const modData = moduleSpecs[mod];
            const caseIdx = state.currentCaseIndex[mod];
            const spec = modData.cases[caseIdx];
            const currentToggles = state.toggles[mod][caseIdx];
            const remainingErrors = Object.values(currentToggles).filter(v => !v).length;

            document.getElementById('inspector-tag').textContent = modData.tag;
            document.getElementById('inspector-title').textContent = spec.title;
            document.getElementById('inspector-desc').textContent = spec.desc;
            document.getElementById('slide-scenario-label').textContent = spec.scenario;

            // Render 3-Case Switcher Bar
            const caseBar = document.getElementById('case-selector-bar');
            caseBar.innerHTML = modData.cases.map((cItem, idx) => {
                const isSelected = idx === caseIdx;
                const cToggles = state.toggles[mod][idx];
                const fixedCount = Object.values(cToggles).filter(Boolean).length;
                const dotColor = fixedCount === 3 ? 'bg-emerald-400' : (fixedCount > 0 ? 'bg-amber-400' : 'bg-rose-500');

                return `
                    <button onclick="switchCase(${idx})" class="px-2 py-1.5 rounded-lg text-xs font-medium transition-all flex items-center justify-center gap-1.5 truncate ${
                        isSelected 
                            ? 'bg-indigo-600 text-white font-bold shadow' 
                            : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/60'
                    }">
                        <span class="w-1.5 h-1.5 rounded-full shrink-0 ${dotColor}"></span>
                        <span class="truncate">${cItem.shortTab.split('：')[1] || cItem.shortTab}</span>
                    </button>
                `;
            }).join('');

            const statusPill = document.getElementById('inspector-status-pill');
            if (remainingErrors === 0) {
                statusPill.textContent = '✨ 完美過關';
                statusPill.className = 'text-xs px-2.5 py-0.5 rounded-full font-semibold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30';
            } else if (remainingErrors === 3) {
                statusPill.textContent = '🚨 NG 災難狀態';
                statusPill.className = 'text-xs px-2.5 py-0.5 rounded-full font-semibold bg-rose-500/20 text-rose-300 border border-rose-500/30';
            } else {
                statusPill.textContent = `🔧 改造中 (剩 ${remainingErrors} 個地雷)`;
                statusPill.className = 'text-xs px-2.5 py-0.5 rounded-full font-semibold bg-amber-500/20 text-amber-300 border border-amber-500/30';
            }

            // Render Control Cards
            const controlsContainer = document.getElementById('inspector-controls');
            controlsContainer.innerHTML = spec.controls.map(ctrl => {
                const isFixed = currentToggles[ctrl.key];
                return `
                    <div onclick="toggleControl('${mod}', '${ctrl.key}')" 
                         class="group cursor-pointer rounded-xl p-3.5 border transition-all duration-200 ${
                            isFixed 
                                ? 'bg-slate-800/70 border-emerald-500/40 shadow-sm shadow-emerald-500/5' 
                                : 'bg-slate-900/90 border-rose-500/40 hover:border-rose-400/60'
                         }">
                        <div class="flex items-center justify-between gap-2 mb-2">
                            <span class="font-bold text-sm text-white group-hover:text-indigo-300 transition">${ctrl.title}</span>
                            <div class="flex items-center gap-2 shrink-0">
                                <span class="text-[11px] font-bold px-2 py-0.5 rounded ${
                                    isFixed 
                                        ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30' 
                                        : 'bg-rose-500/20 text-rose-300 border border-rose-500/30'
                                }">
                                    ${isFixed ? '✓ 已修復 (OK)' : '✕ 踩雷中 (NG)'}
                                </span>
                                <div class="w-9 h-5 rounded-full p-0.5 transition-colors duration-200 ${isFixed ? 'bg-emerald-500' : 'bg-slate-700'}">
                                    <div class="w-4 h-4 rounded-full bg-white shadow transform transition-transform duration-200 ${isFixed ? 'translate-x-4' : 'translate-x-0'}"></div>
                                </div>
                            </div>
                        </div>

                        <div class="text-xs rounded-lg p-2.5 mb-2 ${
                            isFixed 
                                ? 'bg-emerald-950/40 text-emerald-200 border border-emerald-500/20' 
                                : 'bg-rose-950/40 text-rose-200 border border-rose-500/20'
                        }">
                            <div class="flex items-start gap-1.5">
                                <i class="ph-fill ${isFixed ? 'ph-check-circle text-emerald-400' : 'ph-warning-circle text-rose-400'} text-sm shrink-0 mt-0.5"></i>
                                <span>${isFixed ? ctrl.okLabel : ctrl.ngLabel}</span>
                            </div>
                        </div>

                        <p class="text-[11px] text-slate-400 leading-relaxed pl-1">
                            <strong class="text-slate-300">設計原理：</strong>${ctrl.why}
                        </p>
                    </div>
                `;
            }).join('');

            renderInspectorMeter(mod, caseIdx, currentToggles, spec.meterTitle);
        }

        function renderInspectorMeter(mod, caseIdx, t, meterTitle) {
            const meter = document.getElementById('inspector-meter');
            const fixedCount = Object.values(t).filter(Boolean).length;
            const allOk = fixedCount === 3;

            // Live 60-30-10 Color Bar for Color Case 1-1
            if (mod === 'color' && caseIdx === 0) {
                meter.innerHTML = `
                    <div class="flex items-center justify-between text-xs mb-1.5">
                        <span class="font-semibold text-slate-300">${meterTitle}</span>
                        <span class="font-mono text-[11px] ${allOk ? 'text-emerald-400 font-bold' : 'text-rose-400'}">${allOk ? '黃金比例達成' : '色彩比例失衡'}</span>
                    </div>
                    <div class="h-5 w-full rounded-lg overflow-hidden flex border border-slate-700 text-[10px] font-mono font-bold">
                        ${allOk ? `
                            <div class="w-[60%] bg-slate-100 text-slate-800 flex items-center justify-center">60% #F8FAFC 底色</div>
                            <div class="w-[30%] bg-slate-800 text-white flex items-center justify-center">30% #1E293B 主色</div>
                            <div class="w-[10%] bg-emerald-500 text-slate-950 flex items-center justify-center">10%</div>
                        ` : `
                            <div class="w-[35%] bg-yellow-300 text-slate-900 flex items-center justify-center">螢光底</div>
                            <div class="w-[25%] bg-red-600 text-white flex items-center justify-center">亮紅</div>
                            <div class="w-[20%] bg-fuchsia-600 text-white flex items-center justify-center">亮紫</div>
                            <div class="w-[20%] bg-cyan-400 text-slate-900 flex items-center justify-center">亮藍</div>
                        `}
                    </div>
                `;
                return;
            }

            const labels = ['開關 1', '開關 2', '開關 3'];
            meter.innerHTML = `
                <div class="flex items-center justify-between text-xs mb-1.5">
                    <span class="font-semibold text-slate-300">${meterTitle}</span>
                    <span class="font-mono text-[11px] ${allOk ? 'text-emerald-400 font-bold' : 'text-amber-400'}">完成度 ${Math.round((fixedCount / 3) * 100)}%</span>
                </div>
                <div class="grid grid-cols-3 gap-2 text-center text-[11px]">
                    <div class="p-1.5 rounded border ${t.c1 ? 'bg-emerald-950/40 border-emerald-500/30 text-emerald-300' : 'bg-rose-950/40 border-rose-500/30 text-rose-300'}">
                        ${labels[0]}：${t.c1 ? '✓ 通過' : '✕ 待修正'}
                    </div>
                    <div class="p-1.5 rounded border ${t.c2 ? 'bg-emerald-950/40 border-emerald-500/30 text-emerald-300' : 'bg-rose-950/40 border-rose-500/30 text-rose-300'}">
                        ${labels[1]}：${t.c2 ? '✓ 通過' : '✕ 待修正'}
                    </div>
                    <div class="p-1.5 rounded border ${t.c3 ? 'bg-emerald-950/40 border-emerald-500/30 text-emerald-300' : 'bg-rose-950/40 border-rose-500/30 text-rose-300'}">
                        ${labels[2]}：${t.c3 ? '✓ 通過' : '✕ 待修正'}
                    </div>
                </div>
            `;
        }

        function renderBottomTakeaways() {
            const spec = getCurrentCaseSpec();
            if (!spec) return;
            const container = document.getElementById('bottom-takeaway');
            container.innerHTML = `
                <div class="grid grid-cols-3 gap-6">
                    ${spec.takeaways.map(item => `
                        <div class="flex items-start gap-3">
                            <div class="w-8 h-8 rounded-lg bg-indigo-500/15 border border-indigo-500/30 text-indigo-400 flex items-center justify-center shrink-0 mt-0.5">
                                <i class="ph-fill ${item.icon} text-lg"></i>
                            </div>
                            <div>
                                <h4 class="text-xs font-bold text-slate-200">${item.title}</h4>
                                <p class="text-[11px] text-slate-400 leading-snug mt-0.5">${item.desc}</p>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        // =========================================================================
        // 5. DYNAMIC 16:9 SLIDE CANVAS RENDERER (12 COMPLETE INTERACTIVE CASES)
        // =========================================================================
        function renderSlideViewport() {
            const viewport = document.getElementById('slide-viewport');
            const mod = state.currentModule;
            if (mod === 'quiz') return;

            const caseIdx = state.currentCaseIndex[mod];
            const rawToggles = state.toggles[mod][caseIdx];
            const t = state.isComparingNG
                ? { c1: false, c2: false, c3: false }
                : rawToggles;

            if (mod === 'color') {
                if (caseIdx === 0) viewport.innerHTML = buildColorCase1(t);
                else if (caseIdx === 1) viewport.innerHTML = buildColorCase2(t);
                else viewport.innerHTML = buildColorCase3(t);
            } else if (mod === 'typo') {
                if (caseIdx === 0) viewport.innerHTML = buildTypoCase1(t);
                else if (caseIdx === 1) viewport.innerHTML = buildTypoCase2(t);
                else viewport.innerHTML = buildTypoCase3(t);
            } else if (mod === 'image') {
                if (caseIdx === 0) viewport.innerHTML = buildImageCase1(t);
                else if (caseIdx === 1) viewport.innerHTML = buildImageCase2(t);
                else viewport.innerHTML = buildImageCase3(t);
            } else if (mod === 'layout') {
                if (caseIdx === 0) viewport.innerHTML = buildLayoutCase1(t);
                else if (caseIdx === 1) viewport.innerHTML = buildLayoutCase2(t);
                else viewport.innerHTML = buildLayoutCase3(t);
            }
        }

        // -------------------------------------------------------------------------
        // COLOR CASE 1-1: 60-30-10 黃金配色法則 (校園永續減塑行動提案)
        // -------------------------------------------------------------------------
        function buildColorCase1(t) {
            const bgClass = t.c1 ? 'bg-[#F8FAFC]' : 'bg-gradient-to-br from-[#ffff00] via-[#a3ff00] to-[#ff00aa]';
            const headerTagClass = t.c2 ? 'bg-[#1E293B] text-slate-100' : 'bg-red-600 text-green-300 border-2 border-purple-600';
            const mainTitleClass = t.c2 ? 'text-[#0F172A]' : 'text-red-600 drop-shadow-[2px_2px_0px_#00ff00]';
            const subTextClass = t.c2 ? 'text-slate-600' : 'text-lime-800 font-bold';
            const cardBgClass = t.c2 ? 'bg-white border border-slate-200 shadow-sm text-slate-700' : 'bg-yellow-200/90 border-4 border-red-500 text-green-700';
            const sidePanelClass = t.c2 ? 'bg-[#1E293B] text-white shadow-xl' : 'bg-fuchsia-600 border-4 border-yellow-300 text-cyan-200';
            const badge1Class = t.c3 ? (t.c2 ? 'bg-slate-100 text-slate-800' : 'bg-slate-700 text-white') : 'bg-purple-600 text-yellow-300';
            const badge2Class = t.c3 ? (t.c2 ? 'bg-slate-100 text-slate-800' : 'bg-slate-700 text-white') : 'bg-blue-600 text-pink-200';
            const heroStatColor = t.c3 ? 'text-[#10B981]' : 'text-yellow-300 underline decoration-wavy decoration-red-500';
            const ctaHighlight = t.c3 ? 'bg-[#10B981] text-slate-950 font-bold' : 'bg-cyan-400 text-red-600 border-2 border-blue-800 font-bold';

            return `
                <div class="w-full h-full ${bgClass} p-[7%] flex flex-col justify-between slide-element">
                    <div>
                        <div class="flex items-center justify-between mb-3">
                            <span class="px-3 py-1 rounded-full text-xs font-bold tracking-wider ${headerTagClass} slide-element">
                                2026 校園永續發展計畫 • SUSTAINABILITY
                            </span>
                            <span class="text-xs font-mono ${subTextClass}">CASE 1-1</span>
                        </div>
                        <h1 class="text-3xl lg:text-4xl font-black tracking-tight ${mainTitleClass} slide-element">
                            校園減塑行動：全面導入智慧循環杯機制
                        </h1>
                        <p class="text-sm mt-1.5 ${subTextClass} slide-element">
                            透過校內餐飲聯盟與智慧歸還站，打造零廢棄綠色大學生活圈
                        </p>
                    </div>

                    <div class="grid grid-cols-12 gap-5 my-auto pt-2">
                        <div class="col-span-7 space-y-3.5 flex flex-col justify-center">
                            <div class="p-4 rounded-xl ${cardBgClass} slide-element">
                                <div class="flex items-center gap-2.5 mb-1">
                                    <span class="px-2.5 py-0.5 rounded text-xs font-bold ${badge1Class}">策略一：源頭減量</span>
                                    <h3 class="font-bold text-base ${t.c2 ? 'text-[#0F172A]' : 'text-red-700'}">校內 18 間餐廳全面停用一次性塑膠杯</h3>
                                </div>
                                <p class="text-xs leading-relaxed ${t.c2 ? 'text-slate-600' : 'text-green-800'}">
                                    學生憑學生證即可免費借用不鏽鋼與 PP 循環杯，甲地借、乙地還，掃碼歸還僅需 3 秒鐘。
                                </p>
                            </div>

                            <div class="p-4 rounded-xl ${cardBgClass} slide-element">
                                <div class="flex items-center gap-2.5 mb-1">
                                    <span class="px-2.5 py-0.5 rounded text-xs font-bold ${badge2Class}">策略二：集點回饋</span>
                                    <h3 class="font-bold text-base ${t.c2 ? 'text-[#0F172A]' : 'text-blue-800'}">自備環保杯享每杯折抵與永續積分</h3>
                                </div>
                                <p class="text-xs leading-relaxed ${t.c2 ? 'text-slate-600' : 'text-purple-900'}">
                                    累積滿 20 點可兌換校園咖啡券，激勵全校師生養成日常減塑習慣。
                                </p>
                            </div>
                        </div>

                        <div class="col-span-5 rounded-2xl p-5 flex flex-col justify-between ${sidePanelClass} slide-element">
                            <div>
                                <div class="text-xs font-medium opacity-80">循環杯歸還率與減塑成效 KPI</div>
                                <div class="text-5xl font-black tracking-tight my-2 ${heroStatColor} slide-element">
                                    +68%
                                </div>
                                <p class="text-xs leading-relaxed opacity-90">
                                    預計首年可減少 <strong>120,000 個</strong> 一次性塑膠杯垃圾，相當於減少 4.2 公噸碳排放。
                                </p>
                            </div>

                            <div class="mt-4 pt-3 border-t border-white/15 flex items-center justify-between">
                                <span class="text-[11px] opacity-80">試行達成率預估</span>
                                <span class="px-2.5 py-1 rounded-md text-xs ${ctaHighlight} slide-element">
                                    ★ 核心指標 Top 1
                                </span>
                            </div>
                        </div>
                    </div>

                    <div class="flex items-center justify-between text-[11px] pt-2 border-t ${t.c2 ? 'border-slate-200 text-slate-400' : 'border-red-500 text-red-700 font-bold'}">
                        <span>學生會永續發展部提案報告</span>
                        <span>色彩原則：60% #F8FAFC 底色 / 30% #1E293B 主色 / 10% #10B981 重點</span>
                    </div>
                </div>
            `;
        }

        // -------------------------------------------------------------------------
        // COLOR CASE 1-2: 數據圖表色彩降噪 (高中生社團參與動機調查長條圖)

            if (state.quiz.answered) return;
            state.quiz.answered = true;
            state.quiz.selectedOption = optionIdx;
            const currentQ = quizQuestions[state.quiz.currentIndex];
            if (currentQ.options[optionIdx].correct) {
                state.quiz.score += 12.5;
            }
            renderQuiz();

            state.quiz.currentIndex++;
            state.quiz.answered = false;

            state.quiz.score = 0;
            state.quiz.answered = false;
            state.quiz.selectedOption = null;
            renderQuiz();
        }

        window.onload = initApp;
    </script>
</body>
</html>
