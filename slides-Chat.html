<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>簡報改造研究所｜互動學習網站</title><style>
:root{--navy:#173657;--mint:#66dcc9;--coral:#ff897b;--paper:#f4f8fc;--ink:#23384e;--muted:#647789;--line:#dae5ee}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #ffae5a;outline-offset:2px}.top{position:sticky;top:0;z-index:30;background:#fffdfef2;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:12px clamp(14px,3vw,42px);gap:12px}.brand{font-weight:900;color:var(--navy);font-size:19px;cursor:pointer}.brand em{color:#149b94;font-style:normal}.toptools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.btn{padding:10px 17px;border-radius:11px;background:var(--navy);color:white;font-weight:750;transition:transform .15s}.btn:hover{transform:translateY(-1px)}.btn.alt{background:#eaf4f5;color:#14566a}.btn.coral{background:var(--coral);color:#392c32}.btn.ghost{border:1px solid #d7e5ec;background:#fff;color:var(--navy)}.btn:disabled{opacity:.5;cursor:not-allowed}main{max-width:1270px;margin:auto;padding:30px clamp(15px,3vw,40px) 70px}.hero{border-radius:24px;padding:48px;background:linear-gradient(115deg,#183657,#234f70 70%,#247c7b);color:#fff;position:relative;overflow:hidden}.hero:after{content:'✦';font-size:210px;position:absolute;right:35px;top:-30px;color:#ffffff18;pointer-events:none}.hero h1{font-size:clamp(36px,5vw,62px);margin:10px 0}.hero p{font-size:19px;max-width:640px;line-height:1.8;color:#dbf8f3}.eyebrow{font-size:13px;font-weight:850;letter-spacing:2px;color:var(--mint)}.actions{display:flex;flex-wrap:wrap;gap:11px;margin-top:24px}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:23px;box-shadow:0 8px 30px #17365708}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.cols2{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.section-title{margin:32px 0 16px;font-size:26px}.tile{cursor:pointer;transition:.2s;min-height:167px}.tile:hover{border-color:#53b6ad;transform:translateY(-3px)}.tile .emoji{font-size:30px}.tile h3{margin:9px 0}.tile p{color:var(--muted);font-size:14px;line-height:1.7}.chip{background:#e4f6f2;color:#087e72;padding:5px 10px;border-radius:50px;font-size:12px;font-weight:bold;display:inline-block}.small{color:var(--muted);font-size:14px;line-height:1.8}.muted{color:var(--muted)}h2{font-size:28px}h3{font-size:20px}.back{background:transparent;color:#196478;padding:8px 0}.cardline{border-left:4px solid var(--mint);padding:7px 15px;background:#f1faf7;border-radius:6px;margin:12px 0}.compare{display:grid;grid-template-columns:1fr 1fr;gap:13px}.demo-slide{aspect-ratio:16/9;display:flex;flex-direction:column;justify-content:center;gap:9px;padding:7%;border-radius:8px;overflow:hidden;min-height:170px}.demo-slide.bad{background:#fff6b0;color:#e2b839}.demo-slide.good{background:#1b3d60;color:white}.demo-slide .headline{font-weight:900;font-size:clamp(15px,2.2vw,29px)}.demo-slide.bad .headline{font-size:13px}.demo-slide .sub{font-size:clamp(10px,1.35vw,18px)}.demo-slide.bad .sub{font-size:9px}.demo-slide .deco{display:flex;gap:10px;font-size:24px}.caption{text-align:center;font-weight:750;margin:8px 0;color:var(--navy)}.seg{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.seg button{background:#e8f0f5;padding:10px 15px;border-radius:10px;color:var(--navy)}.seg button.active{background:var(--navy);color:white}.question{font-size:22px;font-weight:800;margin:15px 0}.options{display:grid;gap:11px}.option{width:100%;text-align:left;background:#f5f9fc;border:2px solid #dae7ef;padding:15px;border-radius:12px;color:var(--ink)}.option:hover{border-color:#54bdba}.option.correct{background:#e6f8ee;border-color:#32a66b}.option.wrong{background:#fff1ed;border-color:#e99989}.feedback{background:#ecf9f5;border-radius:12px;padding:15px;line-height:1.8;margin-top:15px}.progressbar{height:9px;background:#e8edf2;border-radius:20px;overflow:hidden;margin:12px 0}.progressbar i{height:100%;background:#25ab9f;display:block;transition:.3s}.workarea{display:grid;grid-template-columns:235px minmax(0,1fr) 255px;gap:12px;align-items:start}.inspector,.tools{background:white;border:1px solid var(--line);padding:15px;border-radius:14px}.tools>*,.inspector>*{margin-bottom:10px}.tools button{width:100%;margin-bottom:7px}.editor-center{min-width:0}.canvas-wrap{background:#dce6ee;padding:20px;border-radius:15px;min-width:0}.canvas{width:100%;aspect-ratio:16/9;background:#173657;position:relative;overflow:hidden;box-shadow:0 7px 22px #19344f34;touch-action:none;user-select:none}.element{position:absolute;white-space:pre-wrap;overflow:hidden;display:flex;align-items:center;padding:1px 3px;cursor:move;line-height:1.25}.element.selected{outline:2px dashed #faaf4d;z-index:2}.element .handle{position:absolute;bottom:0;right:0;width:15px;height:15px;background:#ffba59;border:2px solid white;cursor:nwse-resize}.element.icon-el{align-items:center;justify-content:center}.element.shape-el{border-radius:14px}.field{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;margin:9px 0}.field input,.field textarea,.field select{border:1px solid #cadce5;border-radius:8px;padding:9px;width:100%;background:white;color:var(--ink)}.field input[type=color]{padding:3px;height:41px}.row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.row .btn{padding:9px 10px}.checks{list-style:none;padding:0;margin:8px 0}.checks li{padding:9px 0;border-bottom:1px solid #ebf1f6;font-size:14px}.goodtxt{color:#07865d}.warn{color:#b16f16}.teacherbar{background:#163858;color:white;border-radius:15px;padding:19px;margin:12px 0}.teacherbar p{color:#d1eee9;line-height:1.7}.teacher-mode main{max-width:1480px}.teacher-mode .question,.teacher-mode .option{font-size:26px}.teacher-mode .panel{font-size:19px}.step{display:inline-block;background:#e2f6f1;padding:5px 12px;border-radius:30px;font-weight:800;color:#16796e;font-size:13px}.help{background:#fff6e7;padding:13px;border-radius:10px;line-height:1.8;margin-top:13px}.hidden{display:none!important}.guide{min-height:3px;background:#7be8d4;position:absolute;pointer-events:none;z-index:5;opacity:.75}.footer{text-align:center;margin-top:40px;color:#758a98;font-size:13px}.reflection{padding:15px;background:#f5f9fc;border-radius:12px}.reflection textarea{min-height:75px;width:100%;border:1px solid #bcd2dd;border-radius:9px;padding:10px} @media(max-width:1050px){.workarea{grid-template-columns:1fr 1fr}.editor-center{grid-column:1/-1;grid-row:1}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.grid,.cols2,.compare,.workarea{grid-template-columns:1fr}.editor-center{grid-column:auto;grid-row:auto}.hero{padding:26px}.top{align-items:flex-start}.brand{font-size:15px}.toptools{justify-content:flex-end}.btn{font-size:13px;padding:9px}.demo-slide{min-height:140px}}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body><header class="top"><div class="brand" onclick="navigate('home')">✦ <em>簡報改造</em>研究所</div><div class="toptools"><button class="btn ghost" id="soundBtn" onclick="toggleSound()">🔇 音效關</button><button class="btn alt" id="teacherBtn" onclick="toggleTeacher()">👩‍🏫 教師模式</button><button class="btn ghost" onclick="navigate('home')">⌂ 首頁</button></div></header><main id="app"></main><script>

function unitPage(){let i=state.unit,u=DATA.units[i],k=state.lessonStep;html(`<button class="back" onclick="navigate('home')">← 返回學習地圖</button><h2>${symbols[i]} 單元 0${i+1}｜${u.name}</h2><div class="seg"><button class="${k===0?'active':''}" onclick="state.lessonStep=0;render()">① 核心觀念</button><button class="${k===1?'active':''}" onclick="state.lessonStep=1;render()">② 互動實驗</button><button onclick="startQuiz(${i})">③ 隨機挑戰 5 題</button></div>${teacher('請學生先看錯誤版，說出第一個注意到的問題；先聽想法，再揭曉設計原則。',tips[i].join('；'))}<div class="panel">${k===0?`<h3>三個一定要知道的觀念</h3>${tips[i].map((x,j)=>`<div class="cardline"><b>${j+1}. ${x}</b><p class="small">${['觀察視覺差異，再思考這個設計選擇如何幫助觀眾。','改造時不只看漂亮，也要確認清楚、易讀與主題相關。','這是設計參考原則，請依資訊內容和觀眾需求調整。'][j]}</p></div>`).join('')}<div class="compare"><div><div class="demo-slide bad"><div class="headline">校園活動介紹</div><div class="sub">歡迎參加我們的活動，內容十分精彩，還有很多值得認識的特色和各種豐富內容。</div><div class="deco">★ ♥ ✦ ☆ ☀</div></div><div class="caption">修改前：資訊混亂</div></div><div><div class="demo-slide good"><div class="headline">校園活動日</div><div class="sub">三大亮點<br>◆ 精彩表演　◆ 特色攤位　◆ 趣味體驗</div><div class="deco">✦</div></div><div class="caption">修改後：訊息有層次</div></div></div><div class="actions"><button class="btn" onclick="state.lessonStep=1;render()">開始互動實驗 →</button></div>`:lessonLab(i)}</div><div class="actions"><button class="btn ghost" onclick="navUnit(${(i+5)%6})">上一單元</button><button class="btn ghost" onclick="navUnit(${(i+1)%6})">下一單元</button></div>`)}
function lessonLab(i){let tasks=[['改變背景配色','改變文字強調色','調整對比'],['調整標題大小','縮短內文','設定文字層次'],['替換圖示','縮放圖像','移動圖示'],['拖曳卡片','對齊元素','調整留白'],['顯示三步驟','強調重點數字','選擇圖卡'],['統一配色','統一字級','統一圖卡風格']][i];return `<h3>三項互動任務</h3><p class="small">依序使用按鈕觀察簡報的變化；也可進入完整改造工作室親手拖曳。</p><div class="seg">${tasks.map((x,j)=>`<button onclick="lessonChange(${i},${j})">${j+1}｜${x}</button>`).join('')}</div><div id="lessonEffect" class="help">請選擇一項操作。</div><div class="compare"><div><div class="demo-slide bad"><div class="headline">讓想法更有影響力</div><div class="sub">有很多內容和資訊，需要適當整理。</div><div class="deco">★ ♣ ✧</div></div><div class="caption">原始版</div></div><div><div class="demo-slide good" id="lessonPreview"><div class="headline" id="lessonTitle">讓想法更有影響力</div><div class="sub" id="lessonSub">清楚 · 簡單 · 有重點</div><div class="deco" id="lessonIcons">◆ ✦ ◆</div></div><div class="caption">操作區</div></div></div><div class="actions"><button class="btn alt" onclick="openCase(${[1,4,5,4,6,9][i]})">進入可拖曳的改造工作室</button><button class="btn" onclick="startQuiz(${i})">開始本單元挑戰 →</button></div>`}
function lessonChange(i,j){let slide=$('#lessonPreview'),title=$('#lessonTitle'),sub=$('#lessonSub'),icons=$('#lessonIcons');if(!slide)return;let t=themes[(j+i)%themes.length];slide.style.background=t[0];slide.style.color=t[1];title.style.color=t[1];title.style.fontSize=(j===0?'clamp(18px,2.5vw,32px)':j===1?'clamp(24px,3vw,40px)':'clamp(20px,2.5vw,34px)');sub.textContent=j===1?'三個設計重點：清楚、簡單、聚焦':'清楚 · 簡單 · 有重點';icons.textContent=['● ◆ ■','◉ → ◉','✦ ◈ ✦'][j];$('#lessonEffect').textContent=['已完成操作：觀察色彩、位置與視覺層次如何改變畫面。','已完成操作：比較標題和內文的層次與資訊密度。','已完成操作：比較圖卡規律、對齊和一致性。'][j];play()}
function startQuiz(i){state.unit=i;let ids=shuffle(Array.from({length:10},(_,j)=>j)).slice(0,5);state.quiz=ids.map(j=>{let q=DATA.units[i].questions[j];return {...q,choices:shuffle(q.options.map((t,k)=>({text:t,original:k})))}});state.quizIndex=0;state.answered=false;state.choice=null;navigate('quiz')}
function quizPage(){let q=state.quiz[state.quizIndex];if(!q){navUnit(state.unit);return}let n=state.quizIndex;html(`<button class="back" onclick="navUnit(${state.unit})">← 返回單元</button><div class="panel"><div class="row" style="justify-content:space-between"><span class="chip">${DATA.units[state.unit].name}</span><b>第 ${n+1} / 5 題</b></div><div class="progressbar"><i style="width:${(n+1)*20}%"></i></div><h3 class="question">${esc(q.q)}</h3><div class="options">${q.choices.map((c,j)=>`<button class="option ${state.answered?(c.original===q.correct?'correct':j===state.choice?'wrong':''):''}" onclick="answer(${j})" ${state.answered?'disabled':''}>${'ABC'[j]}．${esc(c.text)}</button>`).join('')}</div>${state.answered?`<div class="feedback"><b>${q.choices[state.choice].original===q.correct?'✅ 這個判斷很適當！':'💡 再看一下設計原則'}</b><p>${esc(q.why)}</p><p><b>操作延伸：</b>${esc(q.action)}</p><button class="btn alt" onclick="openCase(${[1,4,5,4,6,9][state.unit]})">動手試改投影片</button></div><div class="actions"><button class="btn" onclick="nextQuiz()">${n===4?'查看學習回饋':'下一題 →'}</button></div>`:''}</div>${teacher('先讓學生說明選項背後的理由，再比較其他答案為何不適合。',q.why)}`)}function answer(j){if(state.answered)return;state.choice=j;state.answered=true;play();render()}function nextQuiz(){if(state.quizIndex===4){navigate('finish')}else{state.quizIndex++;state.answered=false;state.choice=null;render()}}function finishPage(){html(`<div class="panel"><span class="chip">學習回饋 · 不計分</span><h2>🎉 完成本輪 5 題練習！</h2><p>設計不是找出唯一漂亮的答案，而是讓觀眾更容易理解你的想法。試著再抽一組不同題目，或前往改造工作室。</p><div class="reflection"><b>想一想：</b>這個單元中，你最想改善自己簡報的哪個部分？<textarea placeholder="在此輸入想法（不會傳送到網站後台）" oninput="state.reflection=this.value"></textarea></div><div class="actions"><button class="btn" onclick="startQuiz(${state.unit})">重新隨機抽 5 題</button><button class="btn alt" onclick="navigate('challenge')">前往綜合挑戰</button><button class="btn ghost" onclick="navUnit(${state.unit})">回單元</button></div></div>`)}
function challengePage(){html(`<button class="back" onclick="navigate('home')">← 返回首頁</button><h2>🏆 綜合挑戰中心</h2><p class="small">建議依序挑戰，但九個案例均可自由選。沒有分數，也不限制重試次數。</p>${['簡報設計偵探','簡報改造師','設計大師'].map((kind,j)=>`<h3 class="section-title">${['🔎','🛠️','🏆'][j]} ${kind}</h3><div class="grid">${DATA.cases.filter(c=>c.type===kind).map(c=>`<div class="panel tile" onclick="openCase(${c.id})"><span class="chip">案例 ${String(c.id).padStart(2,'0')}</span><h3>${esc(c.title)}</h3><p>${esc(c.goal)}</p><button class="btn alt">開始挑戰 →</button></div>`).join('')}</div>`).join('')}`)}
const iconset=['✦','🌿','📍','🎒','📣','💡','♻','★','◉','➜','☕','🏆'];
function makeScene(c){let type=c.type,hard=type!=='設計大師',title=c.title,desc=hard?c.problem.replace(/；/g,'　·　').slice(0,65):c.goal;return {bg:hard?'#fff4ae':'#173657',fg:hard?'#e1bc42':'#ffffff',accent:hard?'#ff867d':'#62d7c4',els:[{id:1,type:'text',txt:title,x:6,y:7,w:hard?40:72,h:18,size:hard?18:32,color:hard?'#e6be44':'#ffffff',bold:true},{id:2,type:'text',txt:desc,x:hard?8:9,y:hard?42:32,w:hard?63:66,h:hard?27:30,size:hard?12:20,color:hard?'#d7b434':'#e5fff9',bold:false},{id:3,type:'icon',txt:hard?'★':'✦',x:hard?65:77,y:hard?8:36,w:hard?28:15,h:hard?41:28,size:hard?76:62,color:'#ff8473'},{id:4,type:'shape',txt:'',x:6,y:hard?78:84,w:hard?78:30,h:6,size:10,color:hard?'#fa8c7f':'#65dcc7'}]}}
function openCase(id){let c=DATA.cases.find(x=>x.id===id);state.caseId=id;state.editor=makeScene(c);state.original=JSON.parse(JSON.stringify(state.editor));state.selected=null;state.history=[];state.future=[];navigate('editor')}
function snapshot(){state.history.push(JSON.stringify(state.editor));if(state.history.length>40)state.history.shift();state.future=[]}function undo(){if(!state.history.length)return;state.future.push(JSON.stringify(state.editor));state.editor=JSON.parse(state.history.pop());state.selected=null;render()}function redo(){if(!state.future.length)return;state.history.push(JSON.stringify(state.editor));state.editor=JSON.parse(state.future.pop());state.selected=null;render()}
function editorPage(){let c=DATA.cases.find(x=>x.id===state.caseId);if(!state.editor){openCase(state.caseId);return}let isDetective=c.type==='簡報設計偵探';html(`<button class="back" onclick="navigate('challenge')">← 返回挑戰中心</button><h2>${esc(c.type)}｜${esc(c.title)}</h2><p class="small">${esc(c.goal)}　<span class="chip">${esc(c.slide)}</span></p>${teacher('先請學生指出畫面中的問題，並說明他們的修改理由。',c.fix)}<div class="workarea"><aside class="tools"><h3>🧰 工具箱</h3><button class="btn alt" onclick="applyFix()">✨ 參考改造</button><button class="btn ghost" onclick="resetScene()">↺ 還原原始版</button><button class="btn ghost" onclick="undo()">↶ 復原</button><button class="btn ghost" onclick="redo()">↷ 重做</button><button class="btn ghost" onclick="toggleOriginal()">👁 修改前／後</button><div class="field">整頁背景色<input type="color" value="${state.editor.bg}" oninput="editBg(this.value)"></div><p class="small">${isDetective?'偵探任務：點選投影片元素，觀察問題；也可以自己嘗試修改。':'在中間的投影片拖曳元素，拖曳右下角方塊縮放；選取物件後可編輯其樣式。'}</p>${c.type==='設計大師'?`<h4>新增元素</h4><button class="btn alt" onclick="addElement('text')">＋ 文字框</button><button class="btn alt" onclick="addElement('icon')">＋ 圖示</button><button class="btn alt" onclick="addElement('shape')">＋ 形狀</button>`:''}</aside><div class="editor-center"><div class="canvas-wrap"><div id="canvas" class="canvas" aria-label="投影片互動編輯畫布"></div></div><div class="row" style="margin-top:12px"><span class="chip">16:9 工作畫布</span><span class="small" id="editStatus">點選物件可編輯；拖曳移動，右下角縮放</span></div><div class="panel" style="margin-top:14px"><h3>🔍 設計檢查員</h3><ul class="checks" id="checks"></ul><p class="small">檢查僅供學習參考；好設計沒有唯一固定位置。</p><div class="help"><b>改善方向：</b>${esc(c.fix)}</div><div class="reflection" style="margin-top:14px"><b>反思：</b>${esc(c.reflect)}<textarea id="reflect" placeholder="你會如何說明自己的設計選擇？（只留在當前瀏覽器）"></textarea></div></div></div><aside class="inspector"><h3>🎛️ 元素編輯</h3><div id="property"><p class="small">請先點選中間投影片上的物件。</p></div><h4>本案例的觀察重點</h4><p class="small">${esc(c.problem)}</p><h4>操作提醒</h4><p class="small">拖曳時接近投影片中心線或其他物件會自動吸附，並顯示對齊參考線。</p></aside></div>`);drawCanvas()}
function drawCanvas(){let canvas=$('#canvas');if(!canvas)return;let scene=state.editor;canvas.style.background=scene.bg;canvas.innerHTML=scene.els.map(e=>`<div class="element ${e.type==='icon'?'icon-el':e.type==='shape'?'shape-el':''} ${state.selected===e.id?'selected':''}" data-id="${e.id}" style="left:${e.x}%;top:${e.y}%;width:${e.w}%;height:${e.h}%;font-size:clamp(8px,${e.size/12}vw,${e.size*1.3}px);color:${e.color};font-weight:${e.bold?'900':'400'};${e.type==='shape'?'background:'+e.color+';':''}">${e.type==='shape'?'':esc(e.txt)}${state.selected===e.id?'<span class="handle"></span>':''}</div>`).join('');canvas.querySelectorAll('.element').forEach(el=>el.addEventListener('pointerdown',pointerStart));drawProperties();runChecks();persist()}
let dragging=null;function pointerStart(ev){if(ev.button!==0)return;let el=ev.currentTarget,id=+el.dataset.id,e=state.editor.els.find(x=>x.id===id);if(!e)return;ev.preventDefault();state.selected=id;snapshot();const rect=$('#canvas').getBoundingClientRect();dragging={id,x:ev.clientX,y:ev.clientY,start:{...e},rect,resize:ev.target.classList.contains('handle')};el.setPointerCapture(ev.pointerId);el.addEventListener('pointermove',pointerMove);el.addEventListener('pointerup',pointerEnd,{once:true});drawProperties();$('#canvas').querySelectorAll('.element').forEach(x=>x.classList.toggle('selected',+x.dataset.id===id));let handle=el.querySelector('.handle');if(!handle)el.insertAdjacentHTML('beforeend','<span class="handle"></span>')}
function pointerMove(ev){if(!dragging)return;let d=dragging,e=state.editor.els.find(x=>x.id===d.id);let dx=(ev.clientX-d.x)/d.rect.width*100,dy=(ev.clientY-d.y)/d.rect.height*100;if(d.resize){e.w=Math.max(6,Math.min(100-e.x,d.start.w+dx));e.h=Math.max(5,Math.min(100-e.y,d.start.h+dy))}else{e.x=Math.max(0,Math.min(100-e.w,d.start.x+dx));e.y=Math.max(0,Math.min(100-e.h,d.start.y+dy));for(let v of [50,...state.editor.els.filter(x=>x.id!==e.id).map(x=>x.x+x.w/2)])if(Math.abs(e.x+e.w/2-v)<1.5){e.x=Math.max(0,Math.min(100-e.w,v-e.w/2));break}}let el=$('#canvas .element[data-id="'+e.id+'"]');if(el){el.style.left=e.x+'%';el.style.top=e.y+'%';el.style.width=e.w+'%';el.style.height=e.h+'%'}$('#editStatus').textContent='已調整位置／大小；可按「復原」恢復';}
function pointerEnd(ev){dragging=null;let el=ev.currentTarget;el.removeEventListener('pointermove',pointerMove);drawCanvas();play()}
function drawProperties(){let e=state.editor.els.find(x=>x.id===state.selected),p=$('#property');if(!p)return;if(!e){p.innerHTML='<p class="small">請先點選投影片中的元素。</p>';return}p.innerHTML=`<div class="chip">${e.type==='text'?'文字框':e.type==='icon'?'圖示':'幾何形狀'}</div>${e.type!=='shape'?`<label class="field">${e.type==='icon'?'圖示（可輸入或點下方符號）':'內容'}<textarea id="propText" rows="3">${esc(e.txt)}</textarea></label>`:''}<label class="field">顏色<input type="color" id="propColor" value="${e.color}"></label><label class="field">字級／圖示大小 <input id="propSize" type="range" min="10" max="90" value="${e.size}"></label><label class="field">寬度 <input id="propWidth" type="range" min="8" max="90" value="${e.w}"></label>${e.type==='icon'?`<div class="seg">${iconset.map(s=>`<button onclick="editField('txt','${s}')">${s}</button>`).join('')}</div>`:''}<button class="btn alt" onclick="deleteSelected()">刪除物件</button>`;['Text','Color','Size','Width'].forEach(k=>{let input=$('#prop'+k);if(input)input.addEventListener('change',()=>editField({Text:'txt',Color:'color',Size:'size',Width:'w'}[k],input.value))})}
function editField(k,v){let e=state.editor.els.find(x=>x.id===state.selected);if(!e)return;snapshot();e[k]=['size','w'].includes(k)?+v:v;drawCanvas()}function editBg(v){snapshot();state.editor.bg=v;drawCanvas()}function deleteSelected(){if(state.selected===null)return;snapshot();state.editor.els=state.editor.els.filter(x=>x.id!==state.selected);state.selected=null;drawCanvas()}function addElement(type){snapshot();let id=Math.max(0,...state.editor.els.map(x=>x.id))+1;state.editor.els.push({id,type,txt:type==='text'?'請輸入重點':type==='icon'?'✦':'',x:40,y:46,w:24,h:18,size:26,color:type==='shape'?'#6bdccc':'#ffffff',bold:true});state.selected=id;drawCanvas()}
function resetScene(){state.editor=JSON.parse(JSON.stringify(state.original));state.history=[];state.future=[];state.selected=null;drawCanvas()}let comparison=false;function toggleOriginal(){comparison=!comparison;let tmp=state.editor;state.editor=JSON.parse(JSON.stringify(comparison?state.original:state.editor));if(comparison){state._temp=tmp;$('#editStatus').textContent='目前顯示「修改前」，再次點擊返回修改後'}else{state.editor=state._temp;state._temp=null;$('#editStatus').textContent='已返回修改後'}drawCanvas()}
function applyFix(){snapshot();let c=DATA.cases.find(x=>x.id===state.caseId);state.editor.bg='#183657';state.editor.els=state.editor.els.map((e,i)=>({...e,x:[8,9,70,8][i]??e.x,y:[13,40,38,85][i]??e.y,w:[79,57,20,36][i]??e.w,h:[20,29,30,5][i]??e.h,color:e.type==='shape'?'#69dcc8':e.type==='icon'?'#ff9582':'#ffffff',size:i===0?34:i===1?20:e.size,txt:i===1?c.goal:e.txt}));state.selected=null;drawCanvas()}
function runChecks(){let e=state.editor.els,issues=[],bg=state.editor.bg;function lum(c){let v=c.replace('#','');let cs=[0,2,4].map(k=>parseInt(v.slice(k,k+2),16)/255).map(v=>v<=.04045?v/12.92:Math.pow((v+.055)/1.055,2.4));return .2126*cs[0]+.7152*cs[1]+.0722*cs[2]}let pass=e.filter(x=>x.type==='text').every(x=>{let a=lum(bg),b=lum(x.color);return (Math.max(a,b)+.05)/(Math.min(a,b)+.05)>=4.5});issues.push([pass,pass?'文字與背景具有良好對比':'部分文字與背景對比不足，試著換色']);let out=e.some(x=>x.x<0||x.y<0||x.x+x.w>100.2||x.y+x.h>100.2);issues.push([!out,out?'有物件超出投影片畫布':'元素都在投影片範圍內']);let small=e.some(x=>x.type==='text'&&x.size<22);issues.push([!small,small?'部分文字偏小，請依投影距離確認':'文字大小適合初步展示']);let colors=new Set(e.map(x=>x.color));issues.push([colors.size<=4,colors.size>4?'元素色彩較多，檢查是否都有用途':'色彩數量相對集中']);issues.push([null,'圖像與主題是否相關？視覺焦點是否清楚？請自行判斷。']);let el=$('#checks');if(el)el.innerHTML=issues.map(([ok,t])=>`<li class="${ok===true?'goodtxt':ok===false?'warn':''}">${ok===true?'✓':ok===false?'△':'◇'} ${esc(t)}</li>`).join('')}
render();
</script></body></html>
